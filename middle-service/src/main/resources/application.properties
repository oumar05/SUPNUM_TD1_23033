spring.application.name=middle-service

# Port du middle-service (différent du service SOAP)
server.port=8081

# URL du service SOAP backend
soap.service.url=http://localhost:8080/ws

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging
logging.level.org.springframework.ws=DEBUG
logging.level.com.example.middleservice=DEBUG
